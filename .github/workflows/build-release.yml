name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: nightscout/AndroidAPS

jobs:
  build:
    name: Build and sign fullRelease
    runs-on: ubuntu-latest
    steps:
      - name: Determine latest release tag
        id: tag
        run: |
          TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not determine latest release tag of ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream at release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build fullRelease
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease

      - name: Sign APK
        run: |
          APK_IN=$(ls app/build/outputs/apk/full/release/*.apk)
          if [ -z "$APK_IN" ] || [ ! -f "$APK_IN" ]; then
            echo "No APK found in app/build/outputs/apk/full/release/"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          VERSION=$(grep -oPm1 '(?<=const val appVersion = ")[^"]+' buildSrc/src/main/kotlin/Versions.kt)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out "AAPS-$VERSION-signed.apk" \
            "$APK_IN"
          echo "apk=AAPS-$VERSION-signed.apk" >> "$GITHUB_ENV"

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION=$(grep -oPm1 '(?<=const val appVersion = ")[^"]+' buildSrc/src/main/kotlin/Versions.kt)
          RUN_ID=$(date +%Y%m%d-%H%M)
          gh release create "build-$TAG-$RUN_ID" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AAPS $VERSION (built from upstream tag $TAG)" \
            --notes "fullRelease APK built from ${UPSTREAM_REPO} tag $TAG, signed with the configured release keystore."
